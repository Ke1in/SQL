<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Car</title>
    </head>

    <body>
        <p id="car"></p>
    </body>

    <script>
        class Car {
            constructor(brand, model) {
                this.brand = "";
                this.model = "";
            }
        }

        let car1 = new Car();

        car1.brand = "Toyota";
        car1.model = "Corolla";

        document.getElementById("car").innerHTML = `Brand: ${car1.brand}<br/>Model: ${car1.model}`
    </script>
</html>
