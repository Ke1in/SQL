<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Car</title>
    </head>

    <body>
        <p id="car"></p>
    </body>

    <script>
        class Car {
            constructor(brand, model) {
                this.brand = brand;
                this.model = model;
            }
        }

        let car1 = new Car("Toyota", "Corolla");

        document.getElementById("car").innerHTML = `Brand: ${car1.brand}<br/>Model: ${car1.model}`
    </script>
</html>
