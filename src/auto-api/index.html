<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Autot</title>
    </head>
    <body>
        <h1>Autot</h1>

        <div id="autot"></div>
    </body>
    <script>
        fetch("api.php")
            .then(response => response.json())
            .then(cars => {

                let teksti = "";

                cars.forEach(auto => {
                    teksti += `
                    <p>
                        ${auto.make} ${auto.model}
                        (${auto.year})
                    </p>
                    `;
                });

                document.getElementById("autot").innerHTML = teksti;
            });

    </script>
</html>
